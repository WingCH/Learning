name: NativeAirPlayLab
# project.yml 是 source of truth；NativeAirPlayLab.xcodeproj 由 XcodeGen 產生。
# 之後調整 signing、target membership 或 Info.plist key 時，先改這裡再重新 generate。
options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.3"
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultSourceDirectoryType: group
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: AL869FRMV6
    CODE_SIGN_STYLE: Automatic
    # 真機安裝需要有效簽名；不要在 target 設定 CODE_SIGNING_ALLOWED = NO。
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  NativeAirPlayLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NativeAirPlayLab
        excludes:
          - Info.plist
    info:
      path: NativeAirPlayLab/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # 關鍵：讓系統預設以 long-form video route 處理 AirPlay，而不是一般 audio route。
        AVInitialRouteSharingPolicy: LongFormVideo
        UIApplicationSupportsIndirectInputEvents: true
        # AirPlay / background media playback 需要 audio background mode。
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wingchan.NativeAirPlayLab
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - NativeAirPlayLabTests
  NativeAirPlayLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NativeAirPlayLabTests
      # Hostless test target 直接編入被測 helper source，避免依賴本機 XCTest app-host runner。
      - path: NativeAirPlayLab/PlaybackConfiguration.swift
      - path: NativeAirPlayLab/AirPlayRoutePicker.swift
      - path: NativeAirPlayLab/MediaPlaybackConfiguration.swift
    settings:
      base:
        # 關鍵：保持 hostless unit tests；XcodeGen 預設可能加入 TEST_HOST/BUNDLE_LOADER。
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wingchan.NativeAirPlayLabTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  NativeAirPlayLab:
    build:
      targets:
        NativeAirPlayLab: all
        NativeAirPlayLabTests: [test]
    test:
      targets:
        - NativeAirPlayLabTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
