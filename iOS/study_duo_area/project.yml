name: AreaScope
options:
  deploymentTarget:
    iOS: "27.1"
targets:
  AreaScope:
    type: application
    platform: iOS
    sources: [AreaScope]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wingch.study.duoarea
        PRODUCT_NAME: AreaScope
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 螢幕區域 AreaScope
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: 6.0
schemes:
  AreaScope:
    build:
      targets:
        AreaScope: all
